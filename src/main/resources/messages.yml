# PvPCore messages. Written in MiniMessage: https://docs.papermc.io/adventure/minimessage/format/
# Examples: <red>, <#ff8800>, <bold>, <gradient:gold:yellow>text</gradient>,
# <click:run_command:'/spawn'>click me</click>, <hover:show_text:'hello'>hover me</hover>.
# Placeholders are written <name>. <prefix> works in every message.

# Brand identity: Red gradient theme

prefix: "<red>PvPCore</red> <dark_gray>»</dark_gray> "

no-permission: "<prefix> <red>You do not have permission to do that.</red>"
usage: "<prefix> <gray>Usage:</gray> <yellow><usage></yellow>"
unknown-subcommand: "<prefix> <red>Unknown subcommand. Use <yellow>/<label> list</yellow>.</red>"
reloaded: "<prefix> <green>Configuration successfully reloaded.</green>"
mechanics-header: "<prefix> <gray>MECHANICS</gray> <dark_gray>━━━━━━━━━━━━━━━━━━━━</dark_gray>"

teleportation:
  prefix: "<red>PvPCore</red> <dark_gray>»</dark_gray> "

  # General
  no-permission: "<prefix> <red>You don't have permission to do that.</red>"
  player-only: "<prefix> <red>Only players can use this command.</red>"
  player-not-found: "<prefix> <red>Player <white><player></white> is not online.</red>"
  self-target: "<prefix> <red>You cannot teleport to yourself.</red>"
  teleport-disabled: "<prefix> <red>Teleportation is currently disabled.</red>"
  usage: "<prefix> <gray>Usage:</gray> <yellow><usage></yellow>"

  # Teleport Requests
  request-sent: "<prefix> <gray>Request sent to <white><player></white>. Expires in <yellow><seconds>s</yellow>.</gray>"
  request-received: "<prefix> <white><player></white> <gray>wants to teleport to you. <click:run_command:'/tpaccept'><green>[ACCEPT]</green></click> <click:run_command:'/tpdeny'><red>[DENY]</red></click></gray>"
  request-received-here: "<prefix> <white><player></white> <gray>wants you to teleport to them. <click:run_command:'/tpaccept'><green>[ACCEPT]</green></click> <click:run_command:'/tpdeny'><red>[DENY]</red></click></gray>"
  request-accepted: "<prefix> <gray><white><player></white> accepted your request.</gray>"
  request-accepted-self: "<prefix> <gray>You accepted <white><player></white>'s teleport request.</gray>"
  request-denied: "<prefix> <red><white><player></white> denied your request.</red>"
  request-denied-self: "<prefix> <red>Denied the request from <white><player></white>.</red>"
  request-cancelled: "<prefix> <gray>Your teleport request was cancelled.</gray>"
  request-none: "<prefix> <red>You have no pending request, or it has expired.</red>"
  request-cooldown: "<prefix> <red>Please wait <white><seconds>s</white> before sending another teleport request.</red>"
  request-already-pending: "<prefix> <red>You already have a pending teleport request to <white><player></white>.</red>"
  request-sender-offline: "<prefix> <red>The player who sent this request is no longer online.</red>"

  # Teleport while one is already in progress
  teleport-pending: "<prefix> <red>You already have a teleport in progress.</red>"

  # GUI & Setup messages
  rtp-no-regions: "<prefix> <red>No RTP regions are set up. Ask an admin to run /rtp setup.</red>"
  rtp-setup-prompt: "<prefix> <gray><message> (Type 'cancel' to abort)</gray>"
  rtp-setup-cancelled: "<prefix> <red>Cancelled setup.</red>"
  rtp-region-added: "<prefix> <green>Successfully added region for world <white><region></white>.</green>"
  rtp-setup-invalid-name: "<prefix> <red>Invalid region name! Use only letters and numbers.</red>"
  rtp-setting-updated: "<prefix> <green>Setting updated to <white><value></white>.</green>"
  rtp-setup-invalid-number: "<prefix> <red>Please enter a valid number.</red>"

  # Teleportation
  warmup-started: "<prefix> <gray>Teleporting in <white><seconds>s</white>. Do not move or take damage.</gray>"
  warmup-cancelled-move: "<prefix> <red>Teleport cancelled because you moved.</red>"
  warmup-cancelled-damage: "<prefix> <red>Teleport cancelled because you took damage.</red>"
  teleport-success: "<prefix> <green>Teleported successfully.</green>"
  cooldown-active: "<prefix> <gray>Wait <white><seconds>s</white> before teleporting again.</gray>"

  # Other Commands
  tphere-done: "<prefix> <gray>Teleported <white><player></white> to you.</gray>"
  back-none: "<prefix> <red>No previous location to return to.</red>"
  spawn-not-set: "<prefix> <red>The spawn point has not been set yet.</red>"
  spawn-set: "<prefix> <green>Spawn point successfully set.</green>"

  # Random teleport (/rtp)
  teleport-busy: "<prefix> <red>You already have a teleport in progress.</red>"
  rtp-disabled: "<prefix> <red>Random teleport is currently disabled.</red>"
  rtp-unknown-region: "<prefix> <red>Unknown region <white><region></white>. Available: <yellow><regions></yellow></red>"
  rtp-no-region: "<prefix> <red>No random teleport region is set up for this world. Use /rtp [region].</red>"
  rtp-world-unavailable: "<prefix> <red>The world <white><world></white> is not loaded.</red>"
  rtp-searching: "<prefix> <gray>Searching for a safe location...</gray>"
  rtp-failed: "<prefix> <red>Could not find a safe location. Please try again.</red>"
  rtp-success: "<prefix> <green>Teleported to <white><x>, <y>, <z></white> (<world>).</green>"
  rtp-debug-header: "<prefix> <gray>RTP DEBUG</gray> <dark_gray>---------------------------</dark_gray>"
  rtp-info-header: "<prefix> <gray>RTP REGIONS</gray> <dark_gray>━━━━━━━━━━━━━━━━━━━━</dark_gray>"
  rtp-info-region: "  <aqua><id></aqua> <dark_gray>-</dark_gray> <gray>world <white><world></white> (loaded: <white><loaded></white>)</gray> <dark_gray>-</dark_gray> <gray>ready spots <white><ready>/<target></white></gray>"

